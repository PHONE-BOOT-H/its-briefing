name: collect

on:
  schedule:
    # 06:00 KST = 21:00 UTC (전날). 크론은 UTC 기준이다.
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # collect.py는 표준 라이브러리만 쓴다 (설치 단계 없음)
      - name: 수집
        run: python collect.py

      - name: 검증
        run: python verify.py

      - name: 결과 커밋
        run: |
          git config user.name  "its-briefing-bot"
          git config user.email "its-briefing-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git commit -m "chore: 수집 결과 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi
