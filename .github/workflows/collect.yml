name: collect

on:
  schedule:
    # 정각을 피한다. GitHub 스케줄러에서 :00은 전 세계 워크플로가 몰리는 시간이라
    # 예약 이벤트가 지연되거나 통째로 버려진다(문서상 best-effort, 보장 아님).
    # 실측(2026-08-20~28): '0 21'로 두었더니 6일 연속 17~24분씩 밀렸고,
    # 8/26과 8/28은 본 크론과 예비 크론이 '둘 다' 유실됐다. 예비도 정각(:00)이라
    # 같은 혼잡 구간에 걸린 것이 원인이다.
    - cron: '37 20 * * *'   # 05:37 KST
    # 예비. 본 크론과 다른 혼잡대에 둔다. 첫 실행이 정상이면 '변경 없음'으로 끝난다.
    - cron: '13 23 * * *'   # 08:13 KST
  workflow_dispatch:

permissions:
  contents: write

# 크론과 수동 실행이 겹치면 같은 파일을 두 번 커밋해 푸시가 충돌한다
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15      # 소스가 응답을 안 주면 러너가 6시간 물린다
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # collect.py는 표준 라이브러리만 쓴다 (설치 단계 없음)
      - name: 수집
        run: python collect.py

      - name: 검증
        run: python verify.py

      - name: 결과 커밋
        run: |
          git config user.name  "its-briefing-bot"
          git config user.email "its-briefing-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git commit -m "chore: 수집 결과 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi
