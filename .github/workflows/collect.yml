name: collect

on:
  schedule:
    # 06:00 KST = 21:00 UTC (전날). 크론은 UTC 기준이다.
    - cron: '0 21 * * *'
    # 예비. GitHub 스케줄러는 보장이 아니라 best-effort라 장애·고부하 때 이벤트가 통째로
    # 유실된다(2026-08-26 Actions 크리티컬 장애 때 21:00 UTC 실행이 발화하지 않았다).
    # 첫 실행이 정상이면 두 번째는 같은 결과라 '변경 없음'으로 끝난다.
    - cron: '0 23 * * *'   # 08:00 KST
  workflow_dispatch:

permissions:
  contents: write

# 크론과 수동 실행이 겹치면 같은 파일을 두 번 커밋해 푸시가 충돌한다
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15      # 소스가 응답을 안 주면 러너가 6시간 물린다
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # collect.py는 표준 라이브러리만 쓴다 (설치 단계 없음)
      - name: 수집
        run: python collect.py

      - name: 검증
        run: python verify.py

      - name: 결과 커밋
        run: |
          git config user.name  "its-briefing-bot"
          git config user.email "its-briefing-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git commit -m "chore: 수집 결과 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi
