<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ITS 해외 발주·동향</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #fff; --line: #e3e3df; --ink: #1a1a18; --dim: #6b6b64;
    --accent: #1f5f4f; --warn: #b4451f; --new: #1f5f4f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16161a; --card:#1e1e23; --line:#2e2e35; --ink:#e8e8e4; --dim:#9a9a92;
            --accent:#6ec3a8; --warn:#e08a63; --new:#6ec3a8; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:"Pretendard","Malgun Gothic","Segoe UI",system-ui,sans-serif;
         font-size:15px; line-height:1.5; }
  header { padding:20px 24px 0; max-width:1100px; margin:0 auto; }
  h1 { font-size:19px; margin:0 0 4px; letter-spacing:-.02em; }
  .meta { font-size:13px; color:var(--dim); }
  .meta .stale { color:var(--warn); font-weight:600; }
  main { max-width:1100px; margin:0 auto; padding:0 24px 60px; }

  .tabs { display:flex; gap:2px; margin:18px 0 14px; border-bottom:1px solid var(--line); }
  .tabs button { border:0; background:none; padding:9px 16px; font-size:15px; color:var(--dim);
                 cursor:pointer; border-bottom:2px solid transparent; font-family:inherit; }
  .tabs button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--accent); font-weight:600; }

  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px; }
  .chip { border:1px solid var(--line); background:var(--card); color:var(--dim);
          padding:5px 12px; border-radius:999px; font-size:13px; cursor:pointer; font-family:inherit; }
  .chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  select, input[type=search], input[type=date] {
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    padding:5px 9px; border-radius:6px; font-size:13px; font-family:inherit; }
  .spacer { flex:1; }
  .count { font-size:13px; color:var(--dim); }

  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:13px 15px; margin-bottom:8px; cursor:pointer; }
  .card:hover { border-color:var(--dim); }
  .row1 { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:5px; }
  .badge { font-size:11.5px; padding:2px 8px; border-radius:5px; border:1px solid var(--line); color:var(--dim); }
  .badge.country { border-color:var(--accent); color:var(--accent); font-weight:600; }
  .badge.new { background:var(--new); color:#fff; border-color:var(--new); font-weight:600; }
  .badge.dday { border-color:var(--warn); color:var(--warn); font-weight:600; }
  .badge.done { color:var(--dim); }
  .badge.warn { border-color:var(--warn); color:var(--warn); font-weight:600; }
  dd.none { color:var(--dim); font-style:italic; }
  .rel { margin-top:8px; }
  .relbtn { border:0; background:none; padding:2px 0; color:var(--dim); font-size:12.5px;
            cursor:pointer; font-family:inherit; text-decoration:underline dotted; }
  .relbtn:hover { color:var(--ink); }
  .rel-list { list-style:none; margin:6px 0 0; padding:0 0 0 10px; border-left:2px solid var(--line); }
  .rel-list li { font-size:13px; color:var(--dim); padding:4px 0; cursor:pointer; }
  .rel-list li:hover { color:var(--ink); }
  .rel-list li span { font-size:11.5px; margin-left:6px; opacity:.75; }
  .card.expired { opacity:.55; }
  .foldbtn { display:block; width:100%; margin:14px 0 4px; padding:10px;
             border:1px dashed var(--line); border-radius:8px; background:none;
             color:var(--dim); font-size:13px; cursor:pointer; font-family:inherit; }
  .foldbtn:hover { border-color:var(--dim); color:var(--ink); }
  .title { font-size:15px; font-weight:600; letter-spacing:-.01em; margin-bottom:4px; }
  .sub { font-size:13px; color:var(--dim); }
  .empty { text-align:center; color:var(--dim); padding:60px 0; font-size:14px; }

  dialog { position:relative; border:1px solid var(--line); border-radius:12px;
           background:var(--card); color:var(--ink); max-width:640px; width:calc(100% - 40px); padding:0; }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  .dh { padding:16px 20px 12px; border-bottom:1px solid var(--line); }
  .dh .title { font-size:16px; margin:6px 0 0; }
  .db { padding:14px 20px; }
  .db dl { display:grid; grid-template-columns:100px 1fr; gap:7px 14px; margin:0; font-size:14px; }
  .db dt { color:var(--dim); }
  .db dd { margin:0; word-break:break-word; }
  .df { padding:12px 20px 18px; display:flex; gap:8px; flex-wrap:wrap; }
  .btn { border:1px solid var(--line); background:var(--card); color:var(--ink); padding:8px 14px;
         border-radius:7px; font-size:13.5px; cursor:pointer; text-decoration:none; font-family:inherit; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .close { position:absolute; right:14px; top:12px; border:0; background:none; color:var(--dim);
           font-size:20px; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>ITS 해외 발주·동향</h1>
  <div class="meta" id="meta">불러오는 중…</div>
</header>

<main>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="tenders" aria-selected="true">발주정보</button>
    <button role="tab" data-tab="news" aria-selected="false">해외기사</button>
    <button role="tab" data-tab="domestic" aria-selected="false">국내기사</button>
    <button role="tab" data-tab="policy" aria-selected="false">국내 동향</button>
  </div>

  <div class="controls" id="controls">
    <button class="chip" data-range="7" aria-pressed="true">이번 주</button>
    <button class="chip" data-range="3">최근 3일</button>
    <button class="chip" data-range="14">최근 2주</button>
    <button class="chip" data-range="0">전체</button>
    <button class="chip" id="onlyNew" aria-pressed="true">신규만</button>
    <select id="sort">
      <option value="score">관련도순</option>
      <option value="deadline">마감임박순</option>
      <option value="published">최신순</option>
    </select>
    <input type="search" id="q" placeholder="검색 (제목·기관·매체)">
    <span class="spacer"></span>
    <span class="count" id="count"></span>
  </div>

  <div id="list"></div>
</main>

<dialog id="dlg">
  <button class="close" onclick="dlg.close()">×</button>
  <div class="dh"><div id="dBadges"></div><div class="title" id="dTitle"></div></div>
  <div class="db"><dl id="dFields"></dl></div>
  <div class="df">
    <a class="btn primary" id="dLink" target="_blank" rel="noopener">원문 공고 열기 ↗</a>
    <a class="btn" id="dTrans" target="_blank" rel="noopener">제목 번역 ↗</a>
    <button class="btn" id="dCopy">등록문 복사</button>
  </div>
</dialog>

<script>
const S = { tab:'tenders', range:7, onlyNew:true, sort:'score', q:'' };
// 탭 → 기사 보드. 발주정보 탭은 여기 없다.
const TAB_BOARD = { news:'A', domestic:'B', policy:'P' };
const FOLD_SCORE = 25;   // 발주 접기 기준선. 25점은 World Bank·ADB의 소스 기본점이라
                         // "기본점조차 못 받았거나 감점된 건"만 접힌다.
let ITEMS = [], INDEX = null;
// 로컬 날짜. toISOString()은 UTC라 한국에서 오전 9시 이전에 열면 하루 밀린다.
const today = new Date().toLocaleDateString('sv-SE');
const days = (a,b) => Math.round((new Date(b) - new Date(a)) / 86400000);

// ── URL 상태
function readURL() {
  const p = new URLSearchParams(location.search);
  if (p.get('tab')) S.tab = p.get('tab');   // range보다 먼저 읽어야 탭별 기본값이 걸린다
  // 옛 링크 호환. 기사 탭 하나 + 보드 칩이던 시절의 주소를 새 탭으로 옮긴다.
  // 즐겨찾기해 둔 ?tab=news 가 빈 화면으로 떨어지면 안 된다.
  if (S.tab === 'news' && p.get('board') === 'B') S.tab = 'domestic';
  if (!TAB_BOARD[S.tab] && S.tab !== 'tenders') S.tab = 'tenders';
  if (p.get('range') !== null) S.range = +p.get('range');
  else if (S.tab !== 'tenders') S.range = 3;   // 기사·국내동향은 매일 쌓이므로 3일
  if (p.get('new') !== null) S.onlyNew = p.get('new') === '1';
  if (p.get('sort')) S.sort = p.get('sort');
  if (p.get('q')) S.q = p.get('q');
}
function writeURL() {
  const p = new URLSearchParams();
  p.set('tab', S.tab); p.set('range', S.range); p.set('new', S.onlyNew ? 1 : 0); p.set('sort', S.sort);
  if (S.q) p.set('q', S.q);
  history.replaceState(null, '', '?' + p);
}

// ── 로드
// 파일이 하루에 두 개씩 쌓인다. 1년이면 700개라 전부 받으면 첫 화면이 느려진다.
// 기본은 최근 14일치만 받고, '전체'를 고를 때만 나머지를 더 받는다.
const RECENT_DAYS = 14;
let loadedAll = false;

function filePaths(all) {
  const cut = new Date(Date.now() - RECENT_DAYS * 86400000).toLocaleDateString('sv-SE');
  const pick = (list, dir) => (list || [])
    .filter(f => all || f.slice(0, 10) >= cut)
    .map(f => 'data/' + dir + '/' + f);
  return [...pick(INDEX.tenders, 'tenders'), ...pick(INDEX.news, 'news')];
}

// 앞부분만 본다. 같은 기사인데 매체 꼬리가 붙은 판과 떼어낸 판이 섞여 있다.
const normTitle = s => (s || '').toLowerCase().replace(/[^0-9a-z가-힣]/g, '').slice(0, 40);

async function fetchInto(paths) {
  const got = await Promise.all(paths.map(p => fetch(p).then(r => r.json()).catch(() => [])));
  // 같은 항목이 여러 날 파일에 들어 있다. 먼저 잡힌 판본이 이기면 옛 스키마가 남아
  // 새 필드(카테고리·참가범위·낙찰방식)가 화면에서 사라진다. 판본이 올라가면 갈아끼운다.
  const byId = new Map(ITEMS.map(i => [i.id, i]));
  const seenId = new Set(ITEMS.map(i => i.id));
  // id뿐 아니라 제목으로도 합친다. 기사 id 기준을 링크 해시에서 제목 해시로 바꿨는데,
  // 그 전에 저장된 파일에는 옛 id가 남아 있어 같은 기사가 두 번 보인다.
  const byTitle = new Map(ITEMS.filter(i => i.kind === 'news').map(i => [normTitle(i.title), i]));
  for (const it of got.flat()) {
    if (seenId.has(it.id)) {
      const prev = byId.get(it.id);
      if (prev && (it.schema_version || 1) > (prev.schema_version || 1)) Object.assign(prev, it);
      continue;
    }
    if (it.kind === 'news') {
      const nt = normTitle(it.title);
      const prev = byTitle.get(nt);
      if (prev) {
        // 같은 기사의 옛 판본이 먼저 잡혀 있으면 카테고리가 붙은 쪽으로 갈아끼운다.
        // 안 그러면 카테고리 도입 전 파일이 14일 동안 배지를 가린다.
        if (it.category && !prev.category) Object.assign(prev, it);
        continue;
      }
      byTitle.set(nt, it);
    }
    seenId.add(it.id); byId.set(it.id, it); ITEMS.push(it);
  }
}

// 같은 사업이 공고번호만 달리해 두 번 오는 일이 있다 — TED 정정·재공고, 그리고
// World Bank는 한 사업의 문서가 두 건씩 잡힌다. 제목이 완전히 같을 때만 묶고
// 최신 것을 대표로 남긴다(같은 날이면 공고번호가 큰 쪽).
// 40자만 보는 normTitle은 여기 쓰면 안 된다 — TED 제목은 앞부분이 CPV 이름이라
// 다른 사업끼리도 앞 40자가 같다.
const normFull = s => (s || '').toLowerCase().replace(/[^0-9a-z가-힣]/g, '');

function dedupeTenders() {
  const best = new Map();
  for (const it of ITEMS) {
    if (it.kind !== 'tender') continue;
    const k = it.source + '|' + normFull(it.title);
    const p = best.get(k);
    const newer = !p
      || (it.published || '') > (p.published || '')
      || ((it.published || '') === (p.published || '') && (it.ref_no || '') > (p.ref_no || ''));
    if (newer) best.set(k, it);
  }
  const keep = new Set([...best.values()].map(i => i.id));
  ITEMS = ITEMS.filter(it => it.kind !== 'tender' || keep.has(it.id));
}

async function load() {
  INDEX = await (await fetch('data/index.json')).json();
  await fetchInto(filePaths(false));
  dedupeTenders();
  renderMeta(); render();
}

async function loadRest() {
  if (loadedAll) return;
  loadedAll = true;
  const have = new Set(filePaths(false));
  await fetchInto(filePaths(true).filter(p => !have.has(p)));
  dedupeTenders();
  render();
}

function renderMeta() {
  const last = INDEX.last_success ? INDEX.last_success.slice(0,10) : null;
  const gap = last ? days(last, today) : null;
  const label = gap === 0 ? '오늘' : gap === 1 ? '어제' : gap + '일 전';
  const stale = gap !== null && gap > 7;
  const bad = Object.entries(INDEX.sources || {}).filter(([,v]) => !v.ok).map(([k]) => k);
  document.getElementById('meta').innerHTML =
    `마지막 수집: <span class="${stale ? 'stale' : ''}">${last || '알 수 없음'} (${label})</span>` +
    (bad.length ? ` · 수집 실패: ${bad.join(', ')}` : '');
}

// ── 필터·정렬
function visible() {
  const from = S.range
    ? new Date(Date.now() - S.range * 86400000).toLocaleDateString('sv-SE')  // 로컬 기준
    : '0000-00-00';
  const q = S.q.trim().toLowerCase();
  let out = ITEMS.filter(it => S.tab === 'tenders'
    ? it.kind === 'tender'
    : it.kind === 'news' && it.board === TAB_BOARD[S.tab]);
  out = out.filter(it => (S.onlyNew ? (it.first_seen || it.published) >= from : (it.published || '') >= from));
  if (q) out = out.filter(it => [it.title, it.org, it.country, it.country_ko, it.ref_no]
      .filter(Boolean).join(' ').toLowerCase().includes(q));
  const key = { score: it => -it.score, deadline: it => it.deadline || '9999',
                published: it => (it.published || '') }[S.sort];
  const NEWS_CAP = 5;   // 수집기와 같은 규칙을 화면에서도 건다
  out.sort((a,b) => {
    const ka = key(a), kb = key(b);
    if (ka < kb) return S.sort === 'published' ? 1 : -1;
    if (ka > kb) return S.sort === 'published' ? -1 : 1;
    return (a.deadline || '9999') < (b.deadline || '9999') ? -1 : 1;
  });
  // 기사는 보드·게재일별 상한을 화면에서 다시 건다.
  // 수집기는 실행할 때마다 그날 몫을 채우므로, 여러 날 파일을 합치면 같은 게재일에
  // 5건씩 겹쳐 쌓인다 (실측: 8/19 국내동향 14건).
  if (S.tab !== 'tenders') {
    // ⚠ 같은 규칙이 collect.py fetch_news() 끝 '상한' 블록에도 있다.
    //   EXEMPT 목록·상한값·ITS Korea 계열 분리를 양쪽에서 같이 고쳐야 한다.
    //   채움 순서만 다르다 — 수집기는 점수순, 여기는 '오늘 신규' 우선
    //   (여러 날 파일을 합쳐 보므로 오늘 것이 어제 고득점에 밀리면 안 된다).
    //  - 부처·법제처 원문은 상한 면제 (주 3~5건, 검토 가치가 높다)
    //  - 협회(ITS Korea)와 구글뉴스는 계열을 나눠 따로 센다
    //  - 자를 때는 오늘 처음 발견한 것에 우선권 (점수순으로만 자르면 오늘 신규가 밀린다)
    const EXEMPT = ['국토교통부', '법제처'];
    const per = {}, allowed = new Set();
    for (const it of [...out].sort((a,b) =>
        (b.first_seen === today) - (a.first_seen === today))) {
      // 감점 표시된 기사(재가공·기고문)는 상한을 두고 다투지 않는다.
      // 상한에서 잘리면 '제외'가 되는데, 이건 접어서 보여주기로 한 것들이다.
      if (it.flag) { allowed.add(it.id); continue; }
      if (EXEMPT.includes(it.source)) { allowed.add(it.id); continue; }
      const k = (it.source === 'ITS Korea' ? 'assoc' : 'news') + '|' + it.board + '|' + it.published;
      per[k] = (per[k] || 0) + 1;
      if (per[k] <= NEWS_CAP) allowed.add(it.id);
    }
    out = out.filter(it => allowed.has(it.id));   // 표시 순서는 정렬 기준 그대로
  }
  return out;
}

function money(b) {
  if (!b || !b.amount) return null;
  const a = b.amount;
  let s;
  if (a >= 1e8) { const v = a / 1e8; s = (v >= 100 ? Math.round(v).toLocaleString() : v.toFixed(1).replace(/\.0$/,'')) + '억'; }
  else if (a >= 1e4) { const v = a / 1e4; s = (v >= 100 ? Math.round(v).toLocaleString() : v.toFixed(1).replace(/\.0$/,'')) + '만'; }
  else s = a.toLocaleString();
  return `${b.currency} ${s}`;
}

// 마감까지 남은 날 → 배지. 오늘 마감과 지난 마감을 구분한다.
function ddayBadge(deadline) {
  if (!deadline) return '';
  const d = days(today, deadline);
  if (d < 0) return '<span class="badge done">마감됨</span>';
  if (d === 0) return '<span class="badge dday">오늘 마감</span>';
  return `<span class="badge dday">D-${d}</span>`;
}

// ── 같은 사안 묶기 (기사 전용)
//
// 같은 일을 여러 매체가 쓴다. 문자 유사도로는 안 묶인다 — 제목이 매체마다 크게 다르다
// ('강남 심야 자율주행택시 7→19대 확충' / '서울시, 강남 자율주행 택시 19대로 늘린다').
// 그래서 '흔하지 않은 말'(앵커)이 겹치는지를 본다. 흔한지 여부는 사전이 아니라
// 지금 실린 기사들에서 센다 — 손으로 불용어를 관리하지 않기 위해서다.
//
// 규칙: 앵커 2개 이상 공유 + 게재일 1일 이내 + (강한 앵커 1개 이상 또는 앵커 3개 이상).
// 강한 앵커 = 숫자이거나 한글 4자 이상. 영어는 with·safety·zone 같은 흔한 말이
// 앵커로 새기 쉬워 강한 앵커로 치지 않는다(실측에서 서로 다른 사안 둘을 묶었다).
// 데이터는 그대로 두고 화면에서만 접는다 — 판정이 틀려도 되돌릴 게 없다.
const ANCHOR_DF = 4;

function storyTokens(t) {
  const s = t || '', out = new Set();
  (s.match(/\d+만|\d+억|\d+/g) || []).forEach(w => out.add(w));
  (s.match(/[A-Za-z]{3,}/g) || []).forEach(w => out.add(w.toLowerCase()));
  (s.match(/[가-힣]{2,}/g) || []).forEach(w => out.add(w));
  return [...out].filter(w => w.length >= 2);
}
const strongAnchor = w => /^\d/.test(w) || /^[가-힣]{4,}$/.test(w);

function groupStories(items) {
  const df = new Map();
  for (const it of ITEMS) {
    if (it.kind !== 'news') continue;
    for (const w of storyTokens(it.title)) df.set(w, (df.get(w) || 0) + 1);
  }
  const anc = it => new Set(storyTokens(it.title).filter(w => (df.get(w) || 0) <= ANCHOR_DF));
  const cache = new Map();
  const ancOf = it => { if (!cache.has(it.id)) cache.set(it.id, anc(it)); return cache.get(it.id); };
  const out = [], taken = new Set();
  for (const it of items) {
    if (it.kind !== 'news') { out.push(it); continue; }
    if (taken.has(it.id)) continue;
    const rel = [];
    for (const other of items) {
      if (other === it || other.kind !== 'news' || taken.has(other.id)) continue;
      if (other.board !== it.board) continue;
      if (Math.abs(days(it.published, other.published)) > 1) continue;
      const shared = [...ancOf(it)].filter(w => ancOf(other).has(w));
      if (shared.length < 2) continue;
      if (!shared.some(strongAnchor) && shared.length < 3) continue;
      rel.push(other); taken.add(other.id);
    }
    it._related = rel;              // 화면 전용. 저장 데이터는 건드리지 않는다
    taken.add(it.id); out.push(it);
  }
  return out;
}

// 접기 대상: 관련도가 기준선 아래이거나 마감이 지난 발주.
// 지우지 않는다 — 케냐 P161305처럼 제목만으로는 ITS인지 모를 건이 섞여 있다.
// 기사는 접지 않는다. 12점대에도 진짜 ITS 기사가 있어서 점수로 접으면 정답을 숨긴다
// (하루 5건 상한이 이미 그 역할을 한다).
function foldable(it) {
  // 기사는 점수로 접지 않는다. 다만 재가공 의심·기고문은 접는다 —
  // 지우지 않고 가라앉혀서, 필요하면 펼쳐 보게 한다.
  if (it.kind !== 'tender') return !!it.flag;
  if (it.deadline && days(today, it.deadline) < 0) return true;
  return (it.score || 0) < FOLD_SCORE;
}

function cardHTML(it, i) {
  const expired = it.deadline && days(today, it.deadline) < 0;
  const isNew = it.first_seen === today;   // 어제 것까지 NEW로 두면 배지가 의미를 잃는다
  // 기사 배지는 매체명이 아니라 ITS 카테고리다. 매체명은 상세 모달에만 둔다.
  // category가 없는 건 카테고리 도입 이전에 수집된 항목이라 옛 표기로 둔다.
  const head = it.kind === 'tender'
    ? (it.country_ko || it.country || '-')
    : (it.category || it.media || it.source || '');
  return `<div class="card${expired ? ' expired' : ''}" data-i="${i}">
    <div class="row1">
      <span class="badge country">${esc(head)}</span>
      <span class="badge">${esc(it.type || it.source || '')}</span>
      ${it.subtype ? `<span class="badge">${esc(it.subtype)}</span>` : ''}
      ${ddayBadge(it.deadline)}
      ${it.source_scope === 'National' ? '<span class="badge warn">현지업체 한정</span>' : ''}
      ${it.flag ? `<span class="badge done">${esc(it.flag)}</span>` : ''}
      ${isNew ? '<span class="badge new">NEW</span>' : ''}
      ${it.already_posted ? '<span class="badge done">게시판 기등록</span>' : ''}
      ${it.related_posted ? `<span class="badge done">${esc(it.related_posted)} 최근 등록</span>` : ''}
    </div>
    <div class="title">${esc(it.title || '')}</div>
    <div class="sub">${(it.kind === 'tender'
      ? [esc(it.org || ''), money(it.budget), it.published,
         it.deadline ? '마감 ' + it.deadline : '']
      : [it.source !== 'Google News' ? esc(it.source) : '', it.published]
        ).filter(Boolean).join(' · ')}</div>
    ${(it._related || []).length ? `<div class="rel">
      <button class="relbtn" data-rel="${i}">관련 기사 ${it._related.length}건 더</button>
      <ul class="rel-list" hidden>${it._related.map(r =>
        `<li data-rid="${esc(r.id)}">${esc(r.title)}<span>${esc(r.media || r.source || '')}</span></li>`).join('')}</ul>
    </div>` : ''}
  </div>`;
}

function render() {
  const list = document.getElementById('list');
  const items = groupStories(visible());
  const main = items.filter(it => !foldable(it));
  const folded = items.filter(foldable);
  const order = [...main, ...folded];
  document.getElementById('count').textContent =
    main.length + '건' + (folded.length ? ` · 접힘 ${folded.length}` : '');
  if (!order.length) {
    list.innerHTML = '<div class="empty">조건에 맞는 항목이 없습니다.</div>';
    return;
  }
  list.innerHTML =
    (main.length ? main.map((it, i) => cardHTML(it, i)).join('')
                 : '<div class="empty">기본 화면에 표시할 항목이 없습니다.</div>')
    + (folded.length ? `<button class="foldbtn" id="foldBtn" aria-expanded="false">
         관련 낮은 항목 ${folded.length}건 보기</button>
       <div id="foldList" hidden>${folded.map((it, i) =>
         cardHTML(it, main.length + i)).join('')}</div>` : '');
  const btn = document.getElementById('foldBtn');
  if (btn) btn.onclick = () => {
    const box = document.getElementById('foldList');
    box.hidden = !box.hidden;
    btn.setAttribute('aria-expanded', String(!box.hidden));
    btn.textContent = (box.hidden ? '관련 낮은 항목 ' + folded.length + '건 보기'
                                  : '관련 낮은 항목 접기');
  };
  [...list.querySelectorAll('.card')].forEach(el =>
    el.onclick = () => openDetail(order[+el.dataset.i]));
  // 묶인 기사 펼치기. 카드 클릭(상세 열기)과 겹치므로 전파를 막는다.
  [...list.querySelectorAll('.relbtn')].forEach(b => b.onclick = e => {
    e.stopPropagation();
    const ul = b.nextElementSibling;
    ul.hidden = !ul.hidden;
    const n = order[+b.dataset.rel]._related.length;
    b.textContent = ul.hidden ? `관련 기사 ${n}건 더` : '관련 기사 접기';
  });
  [...list.querySelectorAll('.rel-list li')].forEach(li => li.onclick = e => {
    e.stopPropagation();
    const it = ITEMS.find(x => x.id === li.dataset.rid);
    if (it) openDetail(it);
  });
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function openDetail(it) {
  const head = it.kind === 'tender'
    ? (it.country_ko || it.country || '-')
    : (it.category || it.media || it.source || '');
  document.getElementById('dBadges').innerHTML =
    `<span class="badge country">${esc(head)}</span>
     <span class="badge">${esc(it.type || '')}</span>
     ${ddayBadge(it.deadline)}`;
  document.getElementById('dTitle').textContent = it.title || '';
  const f = it.kind === 'news' ? [
    ['분류', it.category], ['매체', it.media], ['구분', it.type], ['게재일', it.published],
    ['처음 발견', it.first_seen],
    ['관련', (it.score_hits || []).filter(h => !h.startsWith('-')).join(', ')],
  ] : [
    // 빈 값 원칙 — 채울 수 없는 항목은 지어내지 않고 '정보 없음'으로 둔다.
    // 아래 KEEP 목록은 값이 없어도 줄을 지우지 않는다. 담당자가 원문을 열어보게 하려는 것이다.
    ['사업명', it.project_title], ['발주처', it.org], ['기관유형', it.org_type],
    ['공고종류', it.subtype], ['예산', money(it.budget)],
    ['참가범위', it.source_scope === 'National' ? '현지업체 한정(National)'
                : it.source_scope === 'International' ? '국제입찰(International)' : null],
    ['낙찰방식', it.selection_method],
    ['게시일', it.published],
    ['마감일', it.deadline ? it.deadline + (it.deadline_time ? ' ' + it.deadline_time : '') : null],
    ['참조번호', it.ref_no], ['출처', it.source],
    ['CPV', (it.cpv || []).join(', ')],
    ['처음 발견', it.first_seen],
    ['관련', (it.score_hits || []).filter(h => !h.startsWith('-')).map(h => h.replace(/^cpv:/, 'CPV ')).join(', ')],
    ['메모', it.notes],
  ];
  const KEEP = ['발주처', '예산', '참가범위', '낙찰방식', '마감일'];
  document.getElementById('dFields').innerHTML = f
    .filter(([k, v]) => v || KEEP.includes(k))
    .map(([k, v]) => v
      ? `<dt>${k}</dt><dd>${esc(v)}</dd>`
      : `<dt>${k}</dt><dd class="none">정보 없음 — 원문 확인</dd>`).join('');
  const safe = /^https?:\/\//i.test(it.link || '') ? it.link : '#';
  document.getElementById('dLink').href = safe;
  document.getElementById('dTrans').href =
    'https://papago.naver.com/?sk=auto&tk=ko&st=' + encodeURIComponent(it.title || '');
  document.getElementById('dCopy').onclick = () => copyTemplate(it);
  dlg.showModal();
}

function copyTemplate(it) {
  const t = it.kind === 'news' ? [
    `제목(원문)    : ${it.title || ''}`,
    `제목(번역)    : `,
    `매체          : ${it.media || ''}`,
    `분류          : ${it.category || ''}`,
    `게재일        : ${it.published || ''}`,
    `원문링크      : ${it.link}`,
    ``,
    `본문 요약(2문장)`,
    `- `,
    `- `,
  ] : [
    `사업명(원문)  : ${it.title || ''}`,
    `사업명(한글)  : `,
    `위치          : ${it.country_ko || it.country || ''}`,
    // 빈 값은 빈칸 그대로 둔다. 'N/A'나 추정치로 메우지 않는다 —
    // 담당자가 원문을 열어 채우는 자리다.
    `발주처        : ${it.org || ''}`,
    `기관유형      : ${it.org_type || ''}`,
    `예산          : ${money(it.budget) || ''}`,
    `참가범위      : ${it.source_scope === 'National' ? '현지업체 한정'
                     : it.source_scope === 'International' ? '국제입찰' : ''}`,
    `낙찰방식      : ${it.selection_method || ''}`,
    `마감일        : ${it.deadline || ''}${it.deadline_time ? ' ' + it.deadline_time : ''}`,
    `공고유형      : ${it.type || ''}`,
    `분류          : 교통, 지능형교통체계(ITS)`,
    `참조번호      : ${it.ref_no || ''}`,
    `원문링크      : ${it.link}`,
    `출처          : ${it.source}`,
    ``,
    `□ 세부내용`,
    ` ○ 기본정보`,
    `  - 사업명 : ${it.title || ''}`,
    `    * `,
    `  - 위치 : ${it.country_ko || it.country || ''}`,
    `  - 시행기관 : ${it.org || ''}`,
    `  - 재원 : `,
    `  - 상태 : ${it.type || ''}`,
    `  - 예산 : ${money(it.budget) || 'N/A'}`,
    `  - 분야 : 교통, 지능형교통체계(ITS)`,
  ].join('\n');
  const b = document.getElementById('dCopy');
  const done = ok => {
    b.textContent = ok ? '복사됨 ✓' : '복사 실패 — 직접 선택해 복사하세요';
    setTimeout(() => b.textContent = '등록문 복사', ok ? 1500 : 2500);
  };
  // 클립보드 API가 막힌 환경(권한 거부·비보안 컨텍스트)에서 조용히 아무 일도
  // 안 일어나면 담당자는 복사된 줄 알고 붙여넣는다. 구형 경로로 한 번 더 시도한다.
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    done(ok);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(() => done(true), fallback);
  } else {
    fallback();
  }
}

// ── 이벤트
function syncTabUI() {
  // 기사·국내동향은 매일 쌓이므로 기본 3일, 발주는 주 단위라 7일
  document.querySelectorAll('.chip[data-range]').forEach(x =>
    x.setAttribute('aria-pressed', +x.dataset.range === S.range));
}
document.querySelectorAll('[role=tab]').forEach(b => b.onclick = () => {
  S.tab = b.dataset.tab;
  S.range = S.tab === 'tenders' ? 7 : 3;
  document.querySelectorAll('[role=tab]').forEach(x =>
    x.setAttribute('aria-selected', x === b));
  syncTabUI(); writeURL(); render();
});
document.querySelectorAll('.chip[data-range]').forEach(b => b.onclick = () => {
  S.range = +b.dataset.range;
  if (S.range === 0) loadRest();
  document.querySelectorAll('.chip[data-range]').forEach(x =>
    x.setAttribute('aria-pressed', x === b));
  writeURL(); render();
});
document.getElementById('onlyNew').onclick = e => {
  S.onlyNew = !S.onlyNew;
  e.target.setAttribute('aria-pressed', S.onlyNew);
  writeURL(); render();
};
document.getElementById('sort').onchange = e => { S.sort = e.target.value; writeURL(); render(); };
// 검색은 키 입력마다 들어온다. history.replaceState를 매 타에 부르면
// Safari가 호출 제한을 건다. 주소 반영만 늦춘다 — 화면은 즉시 갱신.
let qTimer = null;
document.getElementById('q').oninput = e => {
  S.q = e.target.value;
  render();
  clearTimeout(qTimer);
  qTimer = setTimeout(writeURL, 400);
};

readURL();
document.getElementById('sort').value = S.sort;
document.getElementById('q').value = S.q;
document.getElementById('onlyNew').setAttribute('aria-pressed', S.onlyNew);
document.querySelectorAll('[role=tab]').forEach(x =>
  x.setAttribute('aria-selected', x.dataset.tab === S.tab));
document.querySelectorAll('.chip[data-range]').forEach(x =>
  x.setAttribute('aria-pressed', +x.dataset.range === S.range));
syncTabUI();
writeURL();   // 옛 링크(?tab=news&board=B)로 들어온 경우 주소를 새 형식으로 정리한다
load().then(() => { if (S.range === 0) loadRest(); }).catch(e => document.getElementById('list').innerHTML =
  `<div class="empty">데이터를 불러오지 못했습니다.<br>${esc(e.message)}<br><br>
   로컬에서 열 때는 <code>python -m http.server</code>로 띄워야 합니다.</div>`);
</script>
